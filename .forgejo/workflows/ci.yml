name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          apt-get update -qq && apt-get install -y -qq make git >/dev/null
          pip install -q shellcheck-py pyflakes
      - name: unit tests
        run: make test
      - name: lint
        run: make lint
      - name: dashboard is up to date
        run: |
          make dashboard
          git diff --exit-code grafana/disk-health.json
      - name: render configs
        run: make render && python3 -c "import tomllib,glob;[tomllib.load(open(f,'rb')) for f in ['out/telegraf.conf']+glob.glob('out/telegraf.d/*.conf')]"
